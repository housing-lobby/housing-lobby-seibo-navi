<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お歳暮訪問ナビ">
<title>お歳暮訪問ナビ</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<script defer src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script defer src="config.js?v=20261127b"></script>
<script defer src="auth.js?v=20261127b"></script>
<script defer src="app.js?v=20261127b"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: one-screen field app — sticky header, scrolling list, fixed bottom tabs, bottom sheet for owner detail + visit record. Palette: noshi paper + mizuhiki red */
:root{
  --bg:#F6F3EF; --surface:#FFFFFF; --sunk:#ECE6E0; --ink:#26201E; --muted:#6A5F5A; --line:#DDD3CB;
  --accent:#9E2B2F; --accent-ink:#FFFFFF; --accent-soft:#F4E1DF;
  --route:#1F5E7A; --route-soft:#DDEAF0;
  --ok:#2E7D4F; --ok-soft:#DCEFE2; --warn:#946200; --warn-soft:#F6ECD2; --bad:#B03A3A; --bad-soft:#F6DEDE;
  --shadow:0 8px 30px rgba(40,25,20,.18);
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171312; --surface:#211B1A; --sunk:#2B2422; --ink:#EFE8E5; --muted:#AA9D97; --line:#3D3431;
  --accent:#E58A86; --accent-ink:#1C0F0E; --accent-soft:#3D2423;
  --route:#78B6D2; --route-soft:#1D3039;
  --ok:#6FCB93; --ok-soft:#1E3527; --warn:#E3B650; --warn-soft:#3A3019; --bad:#EE8A8A; --bad-soft:#3F2323;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171312; --surface:#211B1A; --sunk:#2B2422; --ink:#EFE8E5; --muted:#AA9D97; --line:#3D3431;
  --accent:#E58A86; --accent-ink:#1C0F0E; --accent-soft:#3D2423;
  --route:#78B6D2; --route-soft:#1D3039;
  --ok:#6FCB93; --ok-soft:#1E3527; --warn:#E3B650; --warn-soft:#3A3019; --bad:#EE8A8A; --bad-soft:#3F2323;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.02em;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand .mz{width:26px;height:26px;flex:0 0 auto}
.brand span{min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.banner{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.banner.bad{background:var(--bad-soft)}
.banner b{display:block;margin-bottom:2px}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:15px;margin:20px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2.sec .n{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
/* who / filter chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
/* progress */
.prog{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:6px;font-size:13px}
.prog .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog b{font-variant-numeric:tabular-nums}
.prog .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent)}
/* date strip */
.dates{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 auto;min-width:62px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px;text-align:center;line-height:1.25}
.date .d{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.date .w{font-size:11px;color:var(--muted)}
.date .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.date.past{background:var(--sunk);border-style:dashed}
.date.zero{opacity:.6}
.date[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);opacity:1}
.date[aria-pressed="true"] .w,.date[aria-pressed="true"] .c{color:var(--accent-ink);opacity:.85}
/* route panel */
.route{margin-top:10px;background:var(--route-soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.route p{margin:0;font-size:13px;color:var(--ink)}
.route .btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn.route-b{background:var(--route);color:#fff}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.warnb{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
/* owner card */
.list{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.card .no{grid-row:span 3;width:26px;height:26px;border-radius:50%;background:var(--route);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:1px}
.card .no.plain{background:var(--sunk);color:var(--muted)}
.card .no.ok{background:var(--ok);color:#fff}
.card .nm{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere;text-align:left;background:none;border:0;padding:0}
.card .nm small{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.card .ad{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.card .acts{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card .acts .btn{flex:1 1 auto;min-height:38px;padding:8px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;line-height:1.6;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.memo{font-size:12.5px;color:var(--bad);font-weight:700;min-width:0;overflow-wrap:anywhere}
.move{display:flex;gap:4px}
.move button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px 16px;color:var(--muted);font-size:14px;text-align:left}
.empty b{color:var(--ink);display:block;margin-bottom:4px}
details.over{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
details.over summary{padding:10px 0;font-weight:700;cursor:pointer}
details.over .list{padding-bottom:12px}
/* area */
.cityh{font-size:12px;color:var(--muted);letter-spacing:.08em;margin:18px 0 6px;font-weight:700}
.towns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rowh{grid-column:1 / -1;font-size:12px;font-weight:700;color:var(--accent);padding:6px 2px 0;border-bottom:1px solid var(--line)}
.town{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.town .t{font-weight:700;font-size:15px}
.town .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.town .bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}
.town .bar i{display:block;height:100%;background:var(--accent)}
.back{margin-top:12px}
.search{margin-top:12px;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:640px;height:var(--tab-h)}
nav.tabs button{border:0;background:none;font-size:12px;color:var(--muted);display:grid;place-items:center;align-content:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,8,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:640px;margin:0 auto}
.sheet .grab{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:10px;z-index:1}
.sheet .grab h3{flex:1;margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;min-width:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:7em 1fr;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sheet .acts .btn{flex:1 1 30%}
.rec{margin-top:16px;display:grid;gap:14px}
.rec h4{margin:0;font-family:var(--f-display);font-size:16px}
.fld{display:grid;gap:6px}
.fld>label,.fld>.lb{font-size:12.5px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;line-height:1.3}
.seg button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-size:13px}
details.qa summary{padding:8px 0;cursor:pointer;color:var(--muted);font-weight:700}
details.qa dl{margin:0 0 10px;display:grid;gap:8px}
details.qa dt{font-weight:700}
details.qa dd{margin:0;color:var(--muted)}
input[type="date"],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.check input{width:22px;height:22px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.done-box{margin-top:16px;background:var(--ok-soft);border-radius:14px;padding:14px;display:grid;gap:10px;font-size:14px}
.summary{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.summary ul{margin:4px 0 0;padding-left:1.2em}
.err{color:var(--bad);font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.skel{height:92px;border-radius:14px;background:var(--sunk);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="mz" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="2" fill="var(--surface)" stroke="var(--line)"/><path d="M7 15h18" stroke="var(--accent)" stroke-width="2.4"/><path d="M16 15c-4-5-8-4-8-1s5 2 8 1c3 1 8 2 8-1s-4-4-8 1z" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>
      <span>お歳暮訪問ナビ<small id="fresh">Asana「お歳暮訪問（2026年12月）」から読み込みます</small></span>
    </div>
    <button class="iconbtn" id="signout" type="button" title="ログアウト"><span id="who"></span></button>
    <button class="iconbtn" id="reload" type="button" aria-label="Asanaから再読み込み">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>更新
    </button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="画面切り替え">
  <div class="in" role="tablist">
    <button type="button" role="tab" data-tab="plan" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>予定</button>
    <button type="button" role="tab" data-tab="area" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>エリア</button>
    <button type="button" role="tab" data-tab="search" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>検索</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
</body>
</html>
